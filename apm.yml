# Config for `apm compile`, consumed by `modules/apps/apm-context-compile.nix`
# (via --root pointed at this repo root; CompilationConfig.from_apm_yml reads
# the compilation: block from the --root target, never from the staging
# $PWD apm.yml the compile app builds). Only source_attribution is set here:
# the compiled AGENTS.md target itself is pinned by an explicit `--target
# codex` CLI flag in the app rather than a `target:`/`targets:` key here,
# because apm's compile target resolution (--target flag > apm.yml
# top-level targets:/target: > auto-detect) reads the SAME top-level
# `targets:` key above that is already pinned to `agent-skills` for the
# pre-existing skills consumer path (apm-skills-install.sh); a nested
# `compilation.target` key is parsed but always overwritten by the CLI's
# resolved effective target before use, so it would have no effect.
compilation:
  source_attribution: true
