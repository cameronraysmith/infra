# Per-repository CI configuration for nixbot.
#
# nixbot reads this filename in preference to buildbot-nix.toml; buildbot-nix
# reads only buildbot-nix.toml and never this one. The two services are
# therefore configured independently even though they build the same
# repository, and buildbot-nix.toml stays authoritative for buildbot-nix.
#
# Every key must be restated here. A present nixbot.toml shadows
# buildbot-nix.toml completely rather than overlaying it, and a file that fails
# to parse silently reverts every key to nixbot's own defaults rather than
# falling back to the legacy file. The nixbot-vanixiets-repo-config check in
# modules/checks/nixbot-vanixiets.nix asserts this file parses and carries the
# keys below, because a typo would otherwise stay invisible until a build
# behaved differently.

# Scope nix-eval-jobs to the x86_64-linux workers, matching buildbot-nix.toml.
# nixbot's default is "checks", which evaluates every system the flake exposes;
# eval failures on unsupported systems (aarch64-linux, aarch64-darwin) then
# poison the build result.
attribute = "checks.x86_64-linux"

# Effects dispatch is restricted to pushes of the default branch.
#
# The two services disagree about what `branch` means on a pull request:
# buildbot-nix reports refs/pull/<N>/merge, nixbot reports the pull request's
# base ref. Both effects here read that value — deploy-docs treats
# branch == "main" as the production promote path, and release-packages
# recognises a pull request by matching refs/pull/<N>/merge. Under nixbot a
# pull request targeting main would therefore report branch == "main" and
# deploy unmerged code to production. Restricting dispatch to default-branch
# pushes keeps nixbot on the one event where the two services report the same
# branch value, so the effects behave identically under both.
#
# Pushes to the default branch dispatch effects unconditionally in both
# services and are unaffected by effects_branches, so these two keys govern
# pull requests and non-default branches only.
effects_branches = []
effects_on_pull_requests = false
