[global]
remove_todos = false
remove_fixme = false
remove_docs = false
# 3.6.0's own defaults for these three; declared explicitly to match the schema
# `uncomment init` now generates. Gitignored vendored/generated trees (e.g.
# `vendor/`, `dist/`) are skipped automatically via respect_gitignore; there is
# still no dedicated exclude-glob config key for tracked trees.
use_default_ignores = true
respect_gitignore = true
traverse_git_repos = false
# Substring, case-insensitive (both the built-in defaults and custom
# preserve_patterns match regardless of case as of 3.6.0), whole-comment match.
# Over-preservation is the intended safe bias. Applies to every language via
# global->language merge.
#
# Deliberately absent from this list because 3.6.0 already preserves them by
# default, position-independently, anywhere in a file: TODO/FIXME/HACK/
# NOSONAR/NOTE/~keep, doc comments, eslint-/@ts-expect-error/@ts-ignore/
# @ts-nocheck/@ts-check/biome-ignore/deno-lint-ignore/deno-fmt-ignore,
# shellcheck/yamllint/tfsec/checkov/trivy/hadolint directives, noqa/type:
# ignore/pyright:/ruff:/mypy:/pylint:/flake8:, prettier-ignore, fmt:off/fmt:on
# (spaced or not), clang-format off/on, clippy::/rustfmt::/allow(/deny(/warn(/
# forbid(/expect(/cfg(, Haskell {-# ... #-}, canonical //go: directives, and
# nolint.
#
# Also deliberately absent, but only preserved by default within roughly the
# first 10 lines of a file (verified by moving an identical marker from line
# 9 to line 13 and watching it start getting removed): SPDX/Copyright/
# License/@license/@copyright (word forms) and "DO NOT EDIT"/"DO NOT MODIFY"/
# "Code generated ..."/"Generated by ..." markers. A license or generated-file
# notice placed later in a file (a second header after a long docstring, or
# text folded in by a concatenating build step) is still removed like any
# other comment; the entries below cover the categories that stay unprotected
# regardless of position.
preserve_patterns = [
  # "// XXX: needs revisit" is still removed by a bare run, despite --help
  # listing XXX alongside TODO/FIXME/HACK/NOSONAR as preserved by default.
  "XXX",
  # not covered by any built-in category.
  "WORKAROUND",
  # encoding / coding declarations: the built-in still misses "coding:" entirely.
  "coding:", "encoding:", "-*- coding",
  # bare copyright-symbol notices without the word "copyright" are still
  # removed; the word forms (Copyright/copyright, License/license, @license,
  # @copyright, SPDX*) are already covered by defaults.
  "(c)", "(C)",
  # generated-file markers not phrased as "Code generated ..." or "Generated
  # by ..." (both covered by defaults) are still removed as plain noise.
  "@generated", "GENERATED", "AUTO-GENERATED", "autogenerated", "auto-generated",
  # managed-block sentinels; broad, intentionally over-preserving; no built-in
  # equivalent exists.
  "BEGIN ", "END ",
  # Rust SAFETY: is still not covered by any built-in default.
  "SAFETY:", "SAFETY",
  # tflint-ignore is the one Terraform-linter directive not covered by
  # default (tfsec:ignore, checkov:skip, and trivy:ignore all are).
  "tflint-ignore",
  # bare "rustfmt" (no "::") is not covered; only "rustfmt::skip"-style
  # usage is.
  "rustfmt",
]
