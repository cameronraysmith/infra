schema: superpowers-bridge-wrspm

context: |
  vanixiets manages nix-darwin laptops and cloud servers using clan with a
  deferred module composition architecture (flake-parts + import-tree). Nix is
  the implementation language for nearly everything here; agent skills, agent
  context files, and OpenSpec schemas are all nix-managed outputs.

  Repository conventions are not restated here. Read the nearest enclosing
  `README.md` before working in a directory — it carries that directory's
  contract and hazards, and a branch-level one indexes its children. The
  generated-versus-authored and source-versus-delivered boundaries, which
  account for most wrong edits in this repo, are stated in
  `modules/home/ai/README.md` and `modules/home/ai/plugins/README.md`. The
  version-control discipline for this jj-colocated repository is in the
  fleet-wide agent context file.

  Both schema bundles are delivered to `~/.local/share/openspec/schemas/`,
  the same collection every other repository resolves from, so a schema edit
  takes effect on the next activation rather than immediately. There is no
  project-tier override; an earlier revision used one, which made this
  repository test a schema state no other repository had.

  When writing tasks: nix-managed outputs are not verified by reading the
  source. Verify by evaluating (nix eval), building (nix build), or by
  inspecting the delivered path after activation, and state which. This
  guidance lives here rather than under `rules.tasks` because OpenSpec
  1.10.0 silently drops rules keyed to the `tasks` artifact — the payload
  from `openspec instructions tasks --json` carries no `rules` key at all,
  with no warning, while sibling artifacts carry theirs. `tasks` is the
  artifact the apply phase tracks, which is the likely cause. Do not add
  `rules.tasks` back until that is fixed upstream; it would look live and
  be inert.

rules:
  proposal:
    - Tag every capability with its stratum (world | interface | behavioral). Tag honestly; an all-behavioral change is a legitimate outcome, not a gap to pad.
    - State the trust boundary for any interface capability. Never claim a guarantee end to end.

  specs:
    - Behavioral requirements use world vocabulary only. Every content noun must resolve against the designation table in specs/world-assumptions. If a requirement can only be stated by naming a machine-side artifact, it belongs in machine-interface.
    - World requirements are indicative, never optative. Their scenarios are violation or monitoring conditions, in the form WHEN the assumption drifts THEN it is void and the requirements relying on it lose their discharge.
    - Interface requirements mention only shared phenomena and never reference world state the machine cannot observe.
    - This repo's designations are nix-flavored and frequently ambiguous between world and machine. A host, a machine, a module, an interface, and a profile all have both a fleet-world sense and a nix-implementation sense. Disambiguate explicitly rather than relying on context.

  design:
    - Name which boundary each decision sits on when it touches vendored-versus-first-party or source-versus-delivered. Those two boundaries produce most of the rework in this repo.

  verify:
    - Section 8 is agent-executed and non-blocking. openspec validate checks markdown structure and delta well-formedness only, and checks no vocabulary grounding, alphabet discipline, or entailment. Never report section 8 as validation.
    - If specs/world-assumptions does not exist, record that as the designation-lint finding rather than reporting the lint clean. A clean lint with no designation table is vacuous.

operations:
  archive:
    guidance:
      - Regenerate packages/docs/src/content/docs/development/traceability/satisfaction.md from the post-sync corpus before the change folder moves, so the PR diff carries it as part of this cycle's state.
      - Rebuild that projection wholesale; never patch it. A patched discharge table accumulates exactly the staleness the artifact exists to prevent.
      - Record undischarged requirements as rows with a follow-up reference. Never omit them and never silently accept them.
